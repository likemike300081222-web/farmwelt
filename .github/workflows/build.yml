name: Build FarmWorld Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Mit Maven bauen
        run: mvn -B clean package

      - name: JAR als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: farmworld-plugin-jar
          path: target/*.jar
